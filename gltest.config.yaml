# genlayer-test networks. Keys come from .env (gitignored), never from this file.
environment: .env
networks:
  default: studionet
  studionet:
    accounts: ["${GENLAYER_KEY}", "${BENCH_SELLER_KEY}"]
    from: "${GENLAYER_KEY}"
    default_wait_interval: 3000
    default_wait_retries: 100
  testnet_bradbury:
    accounts: ["${GENLAYER_KEY}"]
    from: "${GENLAYER_KEY}"
    default_wait_interval: 10000
    default_wait_retries: 360
paths:
  contracts: "contracts"
